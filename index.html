<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse – Internal Medicine MCQ Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4F7;--bg2:#DCEAF0;--card:#FFFFFF;--ink:#0B1F2E;--mute:#5A7385;--line:#C9D9E2;--acc:#00A896;--acc2:#0077B6;--ok:#1B9E5A;--bad:#E23D5E;--warn:#F2A900;--glow:rgba(0,168,150,.35);--ecg:#00A896;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07121C;--bg2:#0D2233;--card:#10283B;--ink:#E8F4FA;--mute:#8FB0C4;--line:#1E4059;--acc:#2EF2D0;--acc2:#38B6FF;--ok:#3DDC97;--bad:#FF5C7A;--warn:#FFC857;--glow:rgba(46,242,208,.35);--ecg:#2EF2D0}}
:root[data-theme="dark"]{--bg:#07121C;--bg2:#0D2233;--card:#10283B;--ink:#E8F4FA;--mute:#8FB0C4;--line:#1E4059;--acc:#2EF2D0;--acc2:#38B6FF;--ok:#3DDC97;--bad:#FF5C7A;--warn:#FFC857;--glow:rgba(46,242,208,.35);--ecg:#2EF2D0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;width:100%;height:100%}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:12px 16px 40px;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.1}
.mon{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 12px;box-shadow:0 0 24px var(--glow)}
.mon canvas{flex:1;height:64px;min-width:0}
.bpm{font:800 26px "Bricolage Grotesque",sans-serif;color:var(--ecg);min-width:66px;text-align:right;transition:color .3s}
.bpm small{display:block;font:500 11px "DM Sans";color:var(--mute)}
.theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px}
.screen{display:none;animation:in .55s cubic-bezier(.2,.9,.3,1) both}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(40px,9vw,72px);font-weight:800;letter-spacing:-.03em}
.hero h1 span{display:inline-block;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite alternate}
@keyframes hue{to{filter:hue-rotate(40deg)}}
.hero p{color:var(--mute);max-width:46ch;margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.panel h3{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{font:500 13px "DM Sans";background:none;border:0;color:var(--acc2);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 13px;border-radius:999px;font:500 14px "DM Sans";cursor:pointer;transition:all .2s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04141f;border-color:transparent;font-weight:700;box-shadow:0 6px 18px var(--glow)}
.chip .n{opacity:.65;font-size:12px;margin-left:5px}
.go{width:100%;margin-top:20px;border:0;border-radius:18px;padding:18px;font:800 20px "Bricolage Grotesque";color:#04141f;background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer;box-shadow:0 10px 30px var(--glow);animation:pulse 2.2s ease-in-out infinite;transition:transform .15s}
.go:hover{transform:scale(1.02)}.go:active{transform:scale(.97)}
@keyframes pulse{50%{box-shadow:0 10px 46px var(--glow),0 0 0 8px transparent}}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:var(--mute);font-size:14px}
.stats b{color:var(--ink)}
.hud{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.ib{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer;transition:transform .15s}.ib:hover{transform:scale(1.1)}.ib:active{transform:scale(.92)}
.ov{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(5,15,25,.68);backdrop-filter:blur(10px);padding:20px}.ov.on{display:grid}
.ovb{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:380px;width:100%;text-align:center;animation:in .35s both;box-shadow:0 0 50px var(--glow)}
.ovb h2{font-size:30px}.ovb p{color:var(--mute);margin:6px 0 16px}.ovb button{display:block;width:100%;margin-top:10px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 15px 'DM Sans';cursor:pointer}.ovb button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04141f;border:0}
.bar{flex:1;min-width:50px;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.pill{font:700 14px "DM Sans";padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.pill.fire{color:var(--warn)}.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.4) rotate(-4deg)}}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 14px "DM Sans"}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 14px 40px rgba(0,0,0,.12)}
.qmeta{color:var(--mute);font-size:13px;margin-bottom:8px}
.qtext{font:600 clamp(20px,4.6vw,26px)/1.3 "Bricolage Grotesque","DM Sans",sans-serif;margin-bottom:18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:10px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:500 16px "DM Sans";cursor:pointer;animation:slide .5s cubic-bezier(.2,.9,.3,1) backwards;transition:border-color .2s,background .2s,transform .15s}
@keyframes slide{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(5px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:700 14px "DM Sans";background:var(--bg2)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent);animation:glow .7s}
.opt.ok .k{background:var(--ok);color:#04141f}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent);animation:shake .5s}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
@keyframes glow{40%{transform:scale(1.03);box-shadow:0 0 30px var(--ok)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.fb{min-height:28px;margin-top:14px;font:700 17px "Bricolage Grotesque";display:flex;justify-content:space-between;align-items:center;gap:10px}

.next{border:0;border-radius:14px;padding:12px 22px;font:700 16px "DM Sans";background:var(--ink);color:var(--bg);cursor:pointer;animation:in .4s both}
.big{font:800 clamp(64px,18vw,120px)/1 "Bricolage Grotesque";letter-spacing:-.04em}
.res{text-align:center;padding-top:20px}
.rwrap{position:relative;width:220px;height:220px;margin:14px auto}
.rwrap svg{transform:rotate(-90deg)}.rwrap circle{fill:none;stroke-width:14}
.rwrap .fg{stroke:url(#g);stroke-linecap:round;stroke-dasharray:597;stroke-dashoffset:597}
.rwrap .bg{stroke:var(--line)}
.rwrap div{position:absolute;inset:0;display:grid;place-items:center;font:800 54px "Bricolage Grotesque"}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.grid3 div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.grid3 b{display:block;font:800 24px "Bricolage Grotesque"}.grid3 span{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.row button{flex:1;min-width:150px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 15px "DM Sans";cursor:pointer}
.row button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04141f;border:0}
.miss{text-align:left;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--card);border-left:4px solid var(--bad)}
.miss small{color:var(--mute)}.miss b{color:var(--ok)}
.flat .bpm{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
</style>
</head>
<body>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="ovb"><h2 id="ovT">Paused</h2><p id="ovP"></p><button class="p" id="ovR">Resume</button><button id="ovF">Finish and see results</button><button id="ovQ">Quit to menu</button></div></div>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<div id="app">
  <div class="mon" id="mon"><canvas id="ecg"></canvas><div class="bpm"><span id="bpm">72</span><small>bpm</small></div><button class="theme" id="th" aria-label="Toggle theme">◐</button></div>

  <section class="screen on" id="home">
    <div class="hero"><h1>Pulse<br><span>MCQ Arena</span></h1>
      <p>200 internal medicine questions from the handbook. Right answers raise your heart rate. A wrong one flatlines it. Pause or stop any time.</p>
      <div class="stats"><span><b id="sTotal">200</b> questions</span><span><b id="sTopics">0</b> topics</span><span>Best: <b id="sBest">–</b></span></div></div>
    <div class="panel"><h3>Topics <button id="all">Select all</button></h3><div class="chips" id="topics"></div></div>
    <div class="panel"><h3>Questions</h3><div class="chips" id="counts"></div></div>
    <div class="panel"><h3>Timer</h3><div class="chips" id="timers"></div></div>
    <button class="go" id="start">Start the round</button>
  </section>

  <section class="screen" id="quiz">
    <div class="hud"><div class="ring"><svg viewBox="0 0 46 46" width="46" height="46"><circle class="bg" cx="23" cy="23" r="19"/><circle class="fg" id="rfg" cx="23" cy="23" r="19" stroke-dasharray="119.4" stroke-dashoffset="0"/></svg><b id="tnum"></b></div>
      <div class="bar"><i id="prog"></i></div><span class="pill" id="qn">1/20</span><span class="pill fire" id="streak">🔥 0</span><button class="ib" id="pz" aria-label="Pause test" title="Pause (P)">⏸</button><button class="ib" id="sp" aria-label="Stop test" title="Stop">⏹</button></div>
    <div class="qcard"><div class="qmeta" id="meta"></div><div class="qtext" id="qt"></div><div id="opts"></div>
      <div class="fb"><span id="msg"></span><button class="next" id="next" hidden>Next question</button></div></div>
  </section>

  <section class="screen" id="result"><div class="res"><h2 id="grade" style="font-size:34px"></h2>
    <div class="rwrap"><svg viewBox="0 0 220 220" width="220" height="220"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00D4B4"/><stop offset="1" stop-color="#38B6FF"/></linearGradient></defs><circle class="bg" cx="110" cy="110" r="95"/><circle class="fg" id="rres" cx="110" cy="110" r="95"/></svg><div id="pct">0%</div></div>
    <div class="grid3"><div><b id="rCor">0</b><span>correct</span></div><div><b id="rStr">0</b><span>best streak</span></div><div><b id="rMiss">0</b><span>missed</span></div></div>
    <div class="row"><button class="p" id="again">New round</button><button id="retry">Retry missed</button></div>
    <h3 style="text-align:left;margin-top:26px" id="mh"></h3><div id="miss"></div></div></section>
</div>
<script>
const D=[{"i": 1, "p": 2, "t": "Temperature", "q": "Which site is considered the standard for measuring body temperature?", "o": ["Rectal", "Forehead (infrared)", "Axillary", "Oral (under the tongue)"], "a": 3}, {"i": 2, "p": 2, "t": "Temperature", "q": "When temperature is measured in the axilla, the reading should be:", "o": ["Increased by 0.5 °C", "Used without correction", "Increased by 1 °C", "Decreased by 0.5 °C"], "a": 0}, {"i": 3, "p": 2, "t": "Temperature", "q": "Rectal temperature, usually used for infants, is corrected by:", "o": ["Subtracting 0.5 °C", "Adding 0.5 °C", "Adding 1 °C", "Subtracting 2 °C"], "a": 0}, {"i": 4, "p": 2, "t": "Temperature", "q": "The normal body temperature range is:", "o": ["38.0 – 39.0 °C", "37.5 – 38.5 °C", "36.4 – 37.2 °C", "35.0 – 36.0 °C"], "a": 2}, {"i": 5, "p": 2, "t": "Temperature", "q": "Fever is defined as a body temperature above:", "o": ["39 °C", "41 °C", "35 °C", "37.2 °C"], "a": 3}, {"i": 6, "p": 2, "t": "Temperature", "q": "Fever is mediated by:", "o": ["Direct damage to the adrenal glands", "Failure of heat-loss mechanisms with an unchanged set point", "Resetting of the hypothalamic thermoregulatory set point", "Peripheral vasoconstriction only"], "a": 2}, {"i": 7, "p": 2, "t": "Temperature", "q": "Hyperthermia is defined as a body temperature above:", "o": ["35 °C", "37.2 °C", "41 °C", "38.5 °C"], "a": 2}, {"i": 8, "p": 2, "t": "Temperature", "q": "Which is a CNS cause of hyperthermia?", "o": ["Pontine hemorrhage", "Near drowning", "Hypopituitarism", "Hypothyroidism"], "a": 0}, {"i": 9, "p": 2, "t": "Temperature", "q": "Neuroleptic malignant syndrome is caused by:", "o": ["Halothane", "Anti-psychotic drugs", "Antibiotics", "Alcohol"], "a": 1}, {"i": 10, "p": 2, "t": "Temperature", "q": "Malignant hyperthermia is associated with:", "o": ["Statins", "Anti-psychotics", "Halothane", "Insulin"], "a": 2}, {"i": 11, "p": 2, "t": "Temperature", "q": "Hypothermia is defined as a body temperature below:", "o": ["33 °C", "35 °C", "36.4 °C", "37.2 °C"], "a": 1}, {"i": 12, "p": 2, "t": "Temperature", "q": "Which endocrine disorder is a listed cause of hypothermia?", "o": ["Phaeochromocytoma", "Thyrotoxicosis", "Hypothyroidism", "Acromegaly"], "a": 2}, {"i": 13, "p": 2, "t": "Temperature", "q": "A fever with fluctuation of less than 1 °C that never reaches normal is called:", "o": ["Sustained (continuous)", "Relapsing", "Remittent", "Intermittent"], "a": 0}, {"i": 14, "p": 2, "t": "Temperature", "q": "Sustained fever is typically seen in:", "o": ["Deep-seated infections", "Viral infections and TB", "Malaria and lymphoma", "Gram-negative sepsis and CNS damage"], "a": 3}, {"i": 15, "p": 2, "t": "Temperature", "q": "Daily fluctuation of more than 1 °C without reaching normal describes which fever pattern?", "o": ["Cyclic", "Intermittent", "Sustained", "Remittent"], "a": 3}, {"i": 16, "p": 2, "t": "Temperature", "q": "Remittent fever is characteristic of:", "o": ["Viral infections and TB", "Gram-negative sepsis", "Malaria", "Familial Mediterranean fever"], "a": 0}, {"i": 17, "p": 2, "t": "Temperature", "q": "Fever that falls to normal at least once daily is:", "o": ["Intermittent", "Remittent", "Sustained", "Cyclic"], "a": 0}, {"i": 18, "p": 2, "t": "Temperature", "q": "Intermittent fever suggests:", "o": ["CNS damage", "Lymphoma", "Viral infection", "Deep-seated or systemic infections"], "a": 3}, {"i": 19, "p": 2, "t": "Temperature", "q": "Bouts of several days of fever alternating with afebrile periods is called:", "o": ["Intermittent fever", "Remittent fever", "Cyclic / periodic / relapsing fever", "Sustained fever"], "a": 2}, {"i": 20, "p": 2, "t": "Temperature", "q": "Which set of conditions is associated with cyclic fever?", "o": ["Viral infection, TB", "Malaria, lymphoma, FMF", "Gram-negative sepsis, CNS damage", "Deep-seated infections, systemic infections"], "a": 1}, {"i": 21, "p": 3, "t": "Septic shock", "q": "Septic shock is defined as:", "o": ["Sepsis without any hypotension", " /* ---------- ECG monitor ---------- */
const ec=$("ecg"),ex=ec.getContext("2d");let ew,eh,buf=[],phase=0,bpm=72,tbpm=72,flat=0,spike=0,last=performance.now();
function rs(){const r=ec.getBoundingClientRect(),d=devicePixelRatio||1;ew=ec.width=r.width*d;eh=ec.height=r.height*d;ex.scale(1,1);buf=new Array(Math.ceil(ew/ (2*d))).fill(0)}
function wave(p){const g=(c,w)=>Math.exp(-((p-c)**2)/(2*w*w));return .15*g(.12,.03)-.12*g(.185,.012)+1*g(.2,.01)-.25*g(.225,.012)+.28*g(.38,.04)}
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;bpm+=(tbpm-bpm)*dt*2;$("bpm").textContent=flat>0?"0":Math.round(bpm);
 const n=Math.round(dt*160);for(let i=0;i<n;i++){let y=0;if(flat>0)y=0;else{phase=(phase+dt/n*bpm/60)%1;y=wave(phase)*(1+spike)}buf.push(y);buf.shift()}
 if(flat>0){flat-=dt;if(flat<=0)document.getElementById("mon").classList.remove("flat")}spike*=.97;
 const d=devicePixelRatio||1;ex.clearRect(0,0,ew,eh);ex.lineWidth=2.2*d;ex.lineJoin="round";ex.strokeStyle=flat>0?css("--bad"):css("--ecg");ex.shadowColor=ex.strokeStyle;ex.shadowBlur=10*d;ex.beginPath();
 buf.forEach((v,i)=>{const x=i*2*d,y=eh*.72-v*eh*.55;i?ex.lineTo(x,y):ex.moveTo(x,y)});ex.stroke();requestAnimationFrame(tick)}
addEventListener("resize",rs);rs();requestAnimationFrame(tick);

const bg=$("bg"),bx=bg.getContext("2d");let orbs=[];
function bs(){bg.width=innerWidth;bg.height=innerHeight;orbs=Array.from({length:22},(_,i)=>({x:Math.random()*bg.width,y:Math.random()*bg.height,r:20+Math.random()*60,vx:(Math.random()-.5)*.3,vy:-.1-Math.random()*.35,pl:i%3===0,a:Math.random()*6}))}
function bd(){bx.clearRect(0,0,bg.width,bg.height);const c1=css("--acc"),c2=css("--acc2");orbs.forEach((o,i)=>{o.x+=o.vx;o.y+=o.vy;o.a+=.01;if(o.y<-90){o.y=bg.height+90;o.x=Math.random()*bg.width}
 bx.globalAlpha=.1;bx.fillStyle=i%2?c1:c2;if(o.pl){const s=o.r*.5,t=s*.34;bx.save();bx.translate(o.x,o.y);bx.rotate(o.a);bx.fillRect(-t,-s,t*2,s*2);bx.fillRect(-s,-t,s*2,t*2);bx.restore()}else{bx.beginPath();bx.arc(o.x,o.y,o.r,0,7);bx.fill()}});requestAnimationFrame(bd)}
addEventListener("resize",bs);bs();bd();

const fx=$("fx"),fc=fx.getContext("2d");let ps=[];function fs(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fs);fs();
function burst(x,y,n=36,cols){cols=cols||[css("--acc"),css("--acc2"),css("--warn"),css("--ok")];for(let i=0;i<n;i++){const a=Math.random()*6.28,s=3+Math.random()*7;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,g:.28,l:1,c:cols[i%cols.length],w:5+Math.random()*6,r:Math.random()*6})}}
(function f(){fc.clearRect(0,0,fx.width,fx.height);ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.l-=.016;p.r+=.2;fc.globalAlpha=Math.max(p.l,0);fc.fillStyle=p.c;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fc.restore()});requestAnimationFrame(f)})();

 chips("topics",topics.map(t=>({v:t,label:t+'<span class="n">'+D.filter(q=>q.t===t).length+'</span>'})),i=>sel.has(i.v),i=>{sel.has(i.v)?sel.delete(i.v):sel.add(i.v)});
 chips("counts",[10,20,50,"All"].map(v=>({v,label:v})),i=>cnt===i.v,i=>cnt=i.v);
 chips("timers",[[0,"No timer"],[15,"15 s"],[20,"20 s"],[30,"30 s"]].map(a=>({v:a[0],label:a[1]})),i=>tm===i.v,i=>tm=i.v)}
$("all").onclick=()=>{sel.size===topics.length?sel.clear():topics.forEach(t=>sel.add(t));draw()};draw();
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");scrollTo(0,0)}

/* ---------- quiz ---------- */
let Q=[],i=0,streak=0,bestS=0,cor=0,wrong=[],locked=false,timer=null,tleft=0;
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}
function begin(list){Q=list;i=0;streak=0;bestS=0;cor=0;wrong=[];tbpm=72;$("streak").textContent="🔥 0";show("quiz");ask()}
$("start").onclick=()=>{let pool=D.filter(q=>sel.has(q.t));if(!pool.length){pool=D;topics.forEach(t=>sel.add(t));draw()}shuffle(pool);begin(cnt==="All"?pool:pool.slice(0,cnt))};
function ask(){locked=false;const q=Q[i];$("qn").textContent=(i+1)+"/"+Q.length;$("prog").style.width=(i/Q.length*100)+"%";
 $("meta").textContent="Handbook p."+q.p+" · "+q.t;$("qt").textContent=q.q;$("msg").textContent="";$("next").hidden=true;
 const box=$("opts");box.innerHTML="";q.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.style.animationDelay=(.08+k*.09)+"s";b.innerHTML='<span class="k">'+L[k]+'</span><span></span>';b.lastChild.textContent=t;b.onclick=()=>pick(k,b);box.appendChild(b)});
 const c=$("qt").parentNode;c.style.animation="none";c.offsetHeight;c.style.animation="in .5s cubic-bezier(.2,.9,.3,1)";
 clearInterval(timer);if(tm){tleft=tm;tick1();startT()}else{$("tnum").textContent="∞";$("rfg").style.strokeDashoffset=0}}
function startT(){clearInterval(timer);timer=setInterval(()=>{tleft--;tick1();if(tleft<=0){clearInterval(timer);pick(-1)}},1000)}
let paused=false;
function openOv(mode){if(paused||!$("quiz").classList.contains("on"))return;paused=true;clearInterval(timer);$("ovT").textContent=mode==="stop"?"End this test?":"Paused";$("ovP").textContent=mode==="stop"?"See your results so far, or leave without them.":"Your timer is stopped. Take your time.";$("ovR").textContent=mode==="stop"?"Keep going":"Resume";$("ov").classList.add("on");$("ovR").focus()}
function closeOv(){paused=false;$("ov").classList.remove("on")}
$("pz").onclick=()=>openOv("pause");$("sp").onclick=()=>openOv("stop");
$("ovR").onclick=()=>{closeOv();if(tm&&!locked)startT()};
$("ovQ").onclick=()=>{closeOv();clearInterval(timer);show("home")};
$("ovF").onclick=()=>{closeOv();clearInterval(timer);const n=i+(locked?1:0);if(!n){show("home");return}Q=Q.slice(0,n);finish()};
function tick1(){$("tnum").textContent=tleft;const f=tleft/tm;$("rfg").style.strokeDashoffset=119.4*(1-f);$("rfg").style.stroke=f<.3?css("--bad"):f<.6?css("--warn"):css("--acc")}
function pick(k,btn){if(locked)return;locked=true;clearInterval(timer);const q=Q[i],ok=k===q.a,bs=[...document.querySelectorAll(".opt")];
 bs.forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add("ok");else if(n===k)b.classList.add("bad");else b.classList.add("dim")});
 const r=(btn||bs[q.a]).getBoundingClientRect();
 if(ok){cor++;streak++;bestS=Math.max(bestS,streak);tbpm=Math.min(180,72+streak*14);spike=.6;burst(r.left+r.width/2,r.top+r.height/2,30+streak*4);
  $("msg").innerHTML=['Correct','Sharp','Nailed it','On fire'][Math.min(3,streak>>1)]+''}
 else{wrong.push(q);streak=0;tbpm=60;flat=1.3;$("mon").classList.add("flat");$("msg").textContent=k<0?"Time is up – answer is "+L[q.a]:"Not quite – answer is "+L[q.a]}
 const s=$("streak");s.textContent="🔥 "+streak;s.classList.remove("pop");s.offsetHeight;if(ok)s.classList.add("pop");
 $("prog").style.width=((i+1)/Q.length*100)+"%";$("next").hidden=false;$("next").textContent=i+1<Q.length?"Next question":"See results";$("next").focus()}
$("next").onclick=()=>{i++;i<Q.length?ask():finish()};
addEventListener("keydown",e=>{if(!$("quiz").classList.contains("on"))return;if(paused){if(e.key==="Escape")$("ovR").click();return}if(e.key==="Escape"||e.key.toLowerCase()==="p"){openOv("pause");return}const k="abcd1234".indexOf(e.key.toLowerCase());if(k>-1&&!locked){const n=k%4;pick(n,document.querySelectorAll(".opt")[n])}else if((e.key==="Enter"||e.key===" ")&&locked){e.preventDefault();$("next").click()}});

/* ---------- results ---------- */
function finish(){clearInterval(timer);show("result");const pct=Math.round(cor/Q.length*100);tbpm=72;
 const g=pct>=90?"Attending material":pct>=75?"Strong resident":pct>=60?"Solid intern":pct>=40?"Keep reviewing":"Back to the handbook";$("grade").textContent=g;
 $("rCor").textContent=cor+"/"+Q.length;$("rStr").textContent=bestS;$("rMiss").textContent=Q.length-cor;
 const ring=$("rres");ring.style.transition="none";ring.style.strokeDashoffset=597;ring.getBoundingClientRect();ring.style.transition="stroke-dashoffset 1.6s cubic-bezier(.2,.9,.3,1)";ring.style.strokeDashoffset=597*(1-pct/100);
 const t0=performance.now();(function c(n){const p=Math.min(1,(n-t0)/1600);$("pct").textContent=Math.round(pct*(1-Math.pow(1-p,3)))+"%";if(p<1)requestAnimationFrame(c)})(t0);
 if(pct>=60){setTimeout(()=>{for(let k=0;k<5;k++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*.35,50),k*220)},500)}
 if(pct>(+store.get("pulse-best")||0)){store.set("pulse-best",pct);$("sBest").textContent=pct+"%"}
 $("retry").style.display=wrong.length?"":"none";$("mh").textContent=wrong.length?"Review "+wrong.length+" missed":"Flawless – nothing to review";
 const m=$("miss");m.innerHTML="";wrong.forEach(q=>{const d=document.createElement("div");d.className="miss";const a=document.createElement("small");a.textContent="p."+q.p+" · "+q.t;const b=document.createElement("div");b.textContent=q.q;const c=document.createElement("div");c.innerHTML="Answer: <b></b>";c.lastChild.textContent=q.o[q.a];d.append(a,b,c);m.appendChild(d)})}
$("again").onclick=()=>{show("home")};
$("retry").onclick=()=>begin(shuffle(wrong.slice()));
</script>
</body>
</html>
